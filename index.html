function tone(freq,duration,type='sine'){
 try{
 audio ||= new AudioContext();if(audio.state==='suspended')audio.resume();
 const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);
 g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g).connect(audio.destination);o.start();o.stop(t+duration);
 }catch{}
}

}
function move(dx,dz){
 const obstacles=solids.concat(gates.filter(g=>g.mesh.visible));
 const blocked=(x,z)=>obstacles.some(o=>Math.abs(x-o.x)<o.w/2+.26&&Math.abs(z-o.z)<o.d/2+.26);
 if(!blocked(rig.position.x+dx,rig.position.z))rig.position.x+=dx;
 if(!blocked(rig.position.x,rig.position.z+dz))rig.position.z+=dz;
}
function aim(controller){
 const source=controller||camera;source.updateWorldMatrix(true,false);ray.ray.origin.setFromMatrixPosition(source.matrixWorld);
 ray.ray.direction.set(0,0,-1).transformDirection(source.matrixWorld);
}
function target(){
 const meshes=interact.filter(i=>i.mesh.visible).map(i=>i.mesh);
 const hit=ray.intersectObjects(meshes)[0];
 if(hit&&hit.distance<3.15)return interact.find(i=>i.mesh===hit.object);
 const origin=ray.ray.origin;
 return interact.filter(i=>i.mesh.visible&&i.mesh.position.distanceTo(origin)<1.55)
 .sort((a,b)=>a.mesh.position.distanceToSquared(origin)-b.mesh.position.distanceToSquared(origin))[0];
}
function use(controller){
 if(!state.hp)return;
 aim(controller);const i=target();if(i)i.act(i);else say('Move closer and aim at an item.');
}
function attack(controller,throwing=false){
 if(!state.hp||elapsed<state.nextAttack)return;
 const ranged=!throwing&&state.gear==='Stun launcher';
 if(throwing&&!state.throwables)return say('Pick up loose tools to throw.');
 if(ranged&&!state.ammo)return say('No stun charges. Press G to throw a tool.');
 if(!throwing&&!ranged&&state.gear==='Empty hands')return say('Pick up the flashlight.');
 state.nextAttack=elapsed+(ranged?.22:.42);
 if(throwing)state.throwables--;if(ranged)state.ammo--;
 aim(controller);const max=ranged?18:throwing?11:2.7;
 const live=enemies.filter(n=>n.g.visible&&n.hp>0);
 const hit=live.map(n=>{
 const body=new T.Vector3(n.g.position.x,1.18,n.g.position.z);
 return {n,along:body.clone().sub(ray.ray.origin).dot(ray.ray.direction),miss:ray.ray.distanceToPoint(body)};
 }).filter(h=>h.along>0&&h.along<max&&h.miss<(throwing?.88:.8)).sort((a,b)=>a.along-b.along)[0];
 if(ranged||throwing){
 const mesh=box(world,...ray.ray.origin.toArray(),.08,.08,throwing?.19:.27,throwing?0xffac5c:0x65e9ff,throwing?0xffac5c:0x65e9ff);
 shots.push({mesh,v:ray.ray.direction.clone().multiplyScalar(20),life:(hit?.along||max)/20});
 }
 tone(ranged?152:98,.13,'triangle');
 if(hit){
 const n=hit.n;if(n.kind==='mortician'&&!uv.visible){say('The Mortician shrugs it off. Restore the UV lights.');return update();}n.hp-=throwing?2:1;n.next=elapsed+.8;
 if(n.hp<=0){
 n.g.visible=false;state.cash+=n.kind==='orderly'||n.kind==='mortician'?250:40;state.rep++;
 if(n.kind==='orderly'){record(1);say('The Orderly drops his badge. The service lift is unlocked.');}
 if(n.kind==='mortician'){record(3);say('You found the Hollow Legion transfer slip. Open the morgue exit.');}
 }else say(n.kind==='orderly'||n.kind==='mortician'?'Boss stability � '+n.hp+' hits left':'Hit');
 }
 update();
}

   return row;
  }));
 }else $('entries').replaceChildren(...(state.clues.length?state.clues.map(i=>{const row=document.createElement('p');row.textContent=clues[i];return row;}):[document.createTextNode('No evidence collected yet.')]));
 }
 keys.clear();
}
$('start').onclick=()=>{start();say('WASD to move � mouse to look � E use � click attack � G throw',8);renderer.domElement.requestPointerLock?.()?.catch?.(()=>{});};
$('campaign').onclick=()=>journal(true,true);$('journal').onclick=()=>journal(true);$('close').onclick=()=>journal(false);$('restart').onclick=reset;
$('use').onclick=()=>use();$('fire').onclick=()=>attack();$('throw').onclick=()=>attack(null,true);
addEventListener('keydown',e=>{
 if(!running||mode)return;const k=e.key.toLowerCase();
 if(k==='j'&&!e.repeat)return journal($('log').hidden);
 if(!$('log').hidden)return;
 keys.add(k);if(e.repeat)return;
 if(k==='e')use();if(k==='g')attack(null,true);
});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!running||mode||!$('log').hidden)return;
 if(e.pointerType==='mouse'){
 if(document.pointerLockElement===renderer.domElement)attack();
 else renderer.domElement.requestPointerLock?.()?.catch?.(()=>{});
 }else{drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);}
});
function look(dx,dy){yaw-=dx*.003;pitch=T.MathUtils.clamp(pitch-dy*.003,-1.35,1.35);camera.rotation.set(pitch,yaw,0,'YXZ');}
addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement&&!mode)look(e.movementX,e.movementY);});
renderer.domElement.addEventListener('pointermove',e=>{if(drag?.id===e.pointerId){look(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;}});
for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,()=>{drag=null;});
for(const b of document.querySelectorAll('[data-key]')){
 b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);};
 b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key);
}
for(let i=0;i<2;i++){
 const c=renderer.xr.getController(i);rig.add(c);
 c.addEventListener('select',()=>{
  if(mode==='immersive-ar')return arNext(c);
  if(!state.hp)return reset();
  aim(c);const item=target();if(item)item.act(item);else attack(c);
 });
 c.addEventListener('squeeze',()=>{if(mode==='immersive-vr')attack(c,true);});
}
async function xr(requested){
 try{
 if(!navigator.xr||!await navigator.xr.isSessionSupported(requested))throw Error('This browser or device does not support '+(requested==='immersive-ar'?'immersive AR':'immersive VR')+'. Open the game over HTTPS on a compatible device.');
 const ar=requested==='immersive-ar';
 const session=await navigator.xr.requestSession(requested,ar?{optionalFeatures:['local','dom-overlay'],domOverlay:{root:document.body}}:{requiredFeatures:['local-floor']});
 mode=requested;renderer.xr.setReferenceSpaceType(ar?'local':'local-floor');document.exitPointerLock?.();
 const previous=rig.position.clone();
 session.addEventListener('end',()=>{
 mode='';arWorld.visible=false;world.visible=true;vrText.visible=false;rig.position.copy(previous);
 camera.position.set(0,1.63,0);camera.rotation.set(pitch,yaw,0,'YXZ');
 if(ar){$('cover').hidden=false;$('hud').style.display='none';}
 });
 if(ar){world.visible=false;arWorld.visible=true;arPlaced=false;arIndex=0;arRelic.visible=false;rig.position.set(0,0,0);$('cover').hidden=true;$('hud').style.display='none';}
 else{vrText.visible=true;start();}
 camera.position.set(0,0,0);camera.rotation.set(0,0,0);
 await renderer.xr.setSession(session);
 }catch(error){$('notice').textContent=error.message;}
}
$('vr').onclick=()=>xr('immersive-vr');$('ar').onclick=()=>xr('immersive-ar');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
reset();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(.05,clock.getDelta());elapsed+=dt;
 scene.background=mode==='immersive-ar'?null:fogColor;
 scene.fog=mode==='immersive-ar'?null:fog;
 if(running&&mode!=='immersive-ar'&&$('log').hidden&&state.hp){
  const session=renderer.xr.getSession();
  let side=Number(keys.has('d'))-Number(keys.has('a')),forward=Number(keys.has('w'))-Number(keys.has('s'));
  let heading=yaw;
  if(mode==='immersive-vr'){
   const input=Array.from(session?.inputSources||[]).find(s=>s.handedness==='left')||Array.from(session?.inputSources||[])[0];
   const axes=input?.gamepad?.axes||[];
   side=axes.length>=4?axes[2]:axes[0]||0;forward=-(axes.length>=4?axes[3]:axes[1]||0);
   const direction=new T.Vector3();renderer.xr.getCamera().getWorldDirection(direction);heading=Math.atan2(-direction.x,-direction.z);
  }
  if(Math.hypot(side,forward)>.17){
   const scale=dt*(mode?2.6:4.1)/Math.max(1,Math.hypot(side,forward));
   move((Math.cos(heading)*side-Math.sin(heading)*forward)*scale,(-Math.sin(heading)*side-Math.cos(heading)*forward)*scale);
  }
  for(const n of enemies){
   if(n.hp<=0)continue;
   const z=rig.position.z;
   if(state.step===1&&z<-7.2)setStep(2,'The Orderly steps out of the service lift.');
   n.g.visible=n.kind==='orderly'?state.step===2:n.kind==='doctor'?state.step>=1&&state.step<3&&z<1:n.kind==='zombie'?state.step>=3&&state.step<6&&z<-14:state.step>=4&&state.step<6;
   if(!n.g.visible)continue;
   const p=n.g.position,dx=rig.position.x-p.x,dz=z-p.z,dist=Math.hypot(dx,dz);
   n.g.rotation.y=Math.atan2(dx,dz);n.tag.rotation.y=-n.g.rotation.y;
   if(dist>1.2){const speed=n.kind==='orderly'?2.03:n.kind==='mortician'?1.48:n.kind==='zombie'?1.18:1.68;p.x+=dx/dist*dt*speed;p.z+=dz/dist*dt*speed;}
   const gait=dist>1.2?Math.sin(elapsed*9)*.55:0;n.legs[0].rotation.x=gait;n.legs[1].rotation.x=-gait;n.arms[0].rotation.x=-gait;n.arms[1].rotation.x=gait;
   if(dist<1.65&&elapsed>n.next){n.next=elapsed+1.12;state.hp=Math.max(0,state.hp-(n.kind==='mortician'?17:n.kind==='orderly'?13:9));tone(55,.16,'triangle');update();}
  }
  for(let i=shots.length-1;i>=0;i--){
   const s=shots[i];s.life-=dt;s.mesh.position.addScaledVector(s.v,dt);
   if(s.life<=0){world.remove(s.mesh);s.mesh.geometry.dispose();s.mesh.material.dispose();shots.splice(i,1);}
  }
  if(!mode){aim();const item=target();$('hint').textContent=item?'E / USE � '+item.name:'';}
  if(elapsed>toast)$('line').textContent='';
 }
 renderer.render(scene,camera);
});
</script></html>
